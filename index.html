<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个网页</title>
  <script>
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
  </script>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f0f4f8;
      --card-bg: #ffffff;
      --text: #1f2937;
      --accent: #0969da;
      --shadow: rgba(0, 0, 0, 0.1);
      --header-bg: rgba(240, 244, 248, 0.92);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #0d1117;
      --card-bg: #161b22;
      --text: #e6edf3;
      --accent: #58a6ff;
      --shadow: rgba(0, 0, 0, 0.45);
      --header-bg: rgba(13, 17, 23, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--page-bg);
      transition: color 180ms ease, background 180ms ease;
    }

    header {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px clamp(24px, 8vw, 96px);
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      transition: background 180ms ease;
    }

    .brand {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    nav a,
    #theme-toggle {
      padding: 10px 16px;
      color: var(--accent);
      font: inherit;
      font-weight: 700;
      background: var(--card-bg);
      text-decoration: none;
      border: 1px solid var(--accent);
      border-radius: 999px;
    }

    #theme-toggle {
      cursor: pointer;
    }

    nav a:hover,
    #theme-toggle:hover {
      color: var(--card-bg);
      background: var(--accent);
    }

    .page {
      width: min(720px, calc(100% - 32px));
      margin: 56px auto;
    }

    section {
      padding: 40px;
      text-align: center;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 30px var(--shadow);
      transition: background 180ms ease, box-shadow 180ms ease;
    }

    #contact {
      margin-top: 24px;
    }

    h1 {
      color: var(--accent);
    }

    .email-link {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      color: white;
      background: var(--accent);
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#home">我的主页</a>
    <nav aria-label="主导航">
      <a href="#contact">联系我</a>
      <button id="theme-toggle" type="button" aria-pressed="false">🌙 深色模式</button>
    </nav>
  </header>

  <main class="page">
    <section id="home">
      <h1>你好，GitHub！</h1>
      <p>这是我使用 Git 管理的第一个网页。</p>
    </section>

    <section id="contact">
      <h2>联系我</h2>
      <p>如果你想交流项目、想法或合作机会，欢迎给我发邮件。</p>
      <a class="email-link" href="mailto:hello@example.com">hello@example.com</a>
    </section>
  </main>

  <script>
    const themeToggle = document.querySelector('#theme-toggle');

    function updateThemeButton() {
      const isDark = document.documentElement.dataset.theme === 'dark';
      themeToggle.textContent = isDark ? '☀️ 浅色模式' : '🌙 深色模式';
      themeToggle.setAttribute('aria-pressed', String(isDark));
    }

    themeToggle.addEventListener('click', () => {
      const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = nextTheme;
      localStorage.setItem('theme', nextTheme);
      updateThemeButton();
    });

    updateThemeButton();
  </script>
</body>
</html>
